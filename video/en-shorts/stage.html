      const sk = ease(p(t, 18.7 + i * .7, 19.2 + i * .7));
      signs += `<div class="sign" style="margin-top:${px(14)};padding:${px(18)} ${px(20)} ${px(18)} ${px(70)};font-size:${px(V ? 32 : 27)};opacity:${sk};transform:translateX(${(1 - sk) * 40}px)"><i style="left:${px(18)};top:${px(18)};width:${px(36)};height:${px(36)};font-size:${px(22)}">!</i><b style="display:block">${s[0]}</b><span style="display:block;font-weight:500;color:#45433d;font-size:.84em;margin-top:4px">${s[1]}</span></div>`;
    });
    const todo = COPY.todo.map((x, i) => `<li style="margin-top:${px(6)}">${i + 1}. ${x}</li>`).join("");
    h += `<div class="abs" style="left:${ox}px;top:${cy - 40}px;width:${cw}px;height:${(V ? H - cy : H - cy - 10)}px;overflow:hidden;opacity:${k * (1 - out)}">
      <div class="card" style="padding:${px(26)};transform:translateY(${(1 - k) * 60 - scroll}px)">
      <div style="font-weight:800;font-size:${px(26)};display:flex;gap:12px;align-items:center">${COPY.level} <span style="display:inline-flex;gap:5px">${`<i style="display:inline-block;width:${px(24)};height:${px(11)};background:var(--ink)"></i>`.repeat(3)}</span><span style="margin-left:auto;font-size:${px(20)};font-weight:700;color:var(--sub)">${COPY.aiApplied}</span></div>
      <div class="banner" style="margin-top:${px(14)};transform:scale(${.96 + .04 * k})"><b style="font-size:${px(V ? 64 : 54)}">${COPY.bannerT}</b><span style="font-size:${px(V ? 32 : 27)}">${COPY.bannerS}</span></div>
      <div style="margin-top:${px(10)};font-size:${px(V ? 21 : 18)};color:var(--sub);line-height:1.45">${COPY.disclaimer}</div>
      <div style="margin-top:${px(16)};padding:${px(16)} ${px(20)};background:#f4f2ec;opacity:${tk}"><div style="font-weight:800;font-size:${px(V ? 30 : 26)}">${COPY.todoTitle}</div><ol style="margin:${px(6)} 0 0;padding:0;list-style:none;font-size:${px(V ? 26 : 22)};line-height:1.4">${todo}</ol></div>
      <div style="margin-top:${px(14)};display:grid;gap:${px(10)};opacity:${bk}"><div class="btn" style="height:${px(V ? 80 : 66)};font-size:${px(V ? 30 : 26)};background:var(--ink);color:#fff">${COPY.famBtn}</div><div class="btn" style="height:${px(V ? 80 : 66)};font-size:${px(V ? 30 : 26)}">${COPY.report}</div></div>
      <div style="margin-top:${px(20)};font-weight:800;font-size:${px(V ? 30 : 26)}">${COPY.signsTitle}</div>${signs}</div></div>`;
  }
  // ④ 피해자가 다음 사람을 지킨다
  if (t >= 24.6 && t < 30.4) {
    h += caption(t, 24.8, 30.2, COPY.c6, top);
    const k = ease(p(t, 24.6, 25.2)), out = ease(p(t, 29.8, 30.4));
    const reported = t > 26.4;
    const by = cy + (V ? 40 : 30);
    h += `<div class="abs" style="left:${ox}px;top:${by + (1 - k) * 60}px;width:${cw}px;opacity:${k * (1 - out)}">
      <div class="btn" style="height:${px(V ? 96 : 80)};font-size:${px(V ? 36 : 30)};background:${reported ? "var(--ink)" : "#fff"};color:${reported ? "#fff" : "var(--ink)"};transform:scale(${1 - .05 * Math.sin(Math.PI * p(t, 25.6, 25.9))})">${reported ? COPY.reported : COPY.report}</div>
      <div style="margin-top:${px(16)};font-size:${px(V ? 26 : 22)};color:var(--sub);line-height:1.45;opacity:${ease(p(t, 26.4, 26.9))}">${COPY.reportNote}</div></div>`;
    const wk = ease(p(t, 27.2, 27.8));
    if (wk > 0) {
      h += `<div class="abs" style="left:${ox}px;top:${by + (V ? 420 : 330) + (1 - wk) * 40}px;width:${cw}px;opacity:${wk * (1 - out)}">
        <div style="font-weight:700;color:var(--sub);font-size:${px(V ? 26 : 22)};margin-bottom:${px(10)}">${COPY.nextSees}</div>
        <div class="warn" style="padding:${px(22)} ${px(24)};font-size:${px(V ? 34 : 28)}">${COPY.warn}<div style="font-weight:600;font-size:${px(V ? 22 : 19)};margin-top:${px(6)}">${COPY.warnNote}</div></div></div>`;
    }
    if (t < 26.0) {
      const m = inout(p(t, 24.9, 25.6)), cx0 = ox + cw * .8, cy0 = by + 380, cx1 = ox + cw * .5, cy1 = by + (V ? 50 : 40);
      h += `<div class="cursor" style="left:${cx0 + (cx1 - cx0) * m}px;top:${cy0 + (cy1 - cy0) * m}px">${cursorSVG}</div>`;
    }
    h += tapAt(t, 25.6, ox + cw * .5 + 6, by + (V ? 56 : 46));
  }
  // ⑤ 부모님께 한 번에
  if (t >= 30.0 && t < 34.6) {
    h += caption(t, 30.2, 34.4, COPY.c7, top);
    const k = ease(p(t, 30.0, 30.6)), out = ease(p(t, 34.0, 34.6)), sk = ease(p(t, 30.7, 31.3));
    const pw = V ? 640 : 520, ph = V ? 1080 : 760, pxx = V ? (W - pw) / 2 : 1130, pyy = V ? 600 : 230;
    const apps = COPY.apps.map((n, i) => [n, ["#34c759", "#fee500", "#25d366", "#d8d6cf"][i]]);
    h += `<div class="abs" style="left:${pxx}px;top:${pyy + (1 - k) * 60}px;width:${pw}px;height:${ph}px;border:10px solid var(--ink);border-radius:64px;background:var(--paper);overflow:hidden;opacity:${k * (1 - out)}">
      <div style="margin:${px(70)} ${px(26)} 0;background:var(--acid);border:2px solid var(--ink);padding:${px(18)};font-weight:800;font-size:${px(V ? 24 : 21)};line-height:1.35">${COPY.famLead}
        <div style="margin-top:${px(12)};background:var(--ink);color:#fff;width:max-content;padding:${px(10)} ${px(16)}">${COPY.famBtn}</div></div>
      <div class="abs sheet" style="left:0;right:0;bottom:0;height:${ph * .52}px;transform:translateY(${(1 - sk) * 100}%);padding:${px(28)}">
        <div style="font-size:${px(V ? 23 : 20)};font-weight:600;line-height:1.4;padding:${px(16)};background:#f4f2ec;border-radius:18px">${COPY.shareText}<div style="color:#2d5bd7;margin-top:${px(6)}">scam-radar-sooty.vercel.app</div></div>
        <div style="display:flex;justify-content:space-between;margin-top:${px(28)}">${apps.map(([n, c]) => `<div class="app" style="font-size:${px(V ? 18 : 16)}"><i style="width:${px(V ? 92 : 78)};height:${px(V ? 92 : 78)};background:${c}"></i>${n}</div>`).join("")}</div></div></div>`;
  }
  // ⑥ 끝 카드
  if (t >= 34.2) {
    const k = ease(p(t, 34.2, 34.9));
    h += `<div class="abs" style="left:${px(V ? 70 : 110)};right:${px(V ? 70 : 110)};top:${V ? 620 : 300}px;opacity:${k};transform:translateY(${(1 - k) * 30}px)">
      <div class="brand" style="font-size:${px(V ? 92 : 84)}"><span class="ring" style="width:${px(54)};height:${px(54)};border-width:9px"></span>SCAM RADAR</div>
      <div class="cap" style="font-size:${px(V ? 64 : 60)};margin-top:${px(30)}">${COPY.end1}</div>
      <div style="margin-top:${px(34)};font-size:${px(V ? 30 : 28)};font-weight:700;color:var(--sub)">${COPY.end2}</div></div>
      <div class="abs" style="left:${px(V ? 70 : 110)};right:${px(V ? 70 : 110)};bottom:${px(V ? 110 : 60)};font-size:${px(20)};color:#8e8b83;line-height:1.45;opacity:${k}">${COPY.endNote}</div>`;
  }
  v.innerHTML = h;
  // ② 커서: 실제 버튼 위치를 재서 [캡처 올리기] → [확인하기]
  if (t >= 9.9 && t < 15.6) {
    const up = document.getElementById("v-up")?.getBoundingClientRect(), go = document.getElementById("v-go")?.getBoundingClientRect();
    if (up && go) {
      const out = ease(p(t, 15.0, 15.6));
      const ux = up.left + up.width * .6, uy = up.top + up.height * .5, gx = go.left + go.width * .6, gy = go.top + go.height * .5;
      const sx = ux + up.width * .25, sy = uy + (V ? 520 : 360);
      let x, y;
      if (t < 13.4) { const m = inout(p(t, 9.9, 10.9)); x = sx + (ux - sx) * m; y = sy + (uy - sy) * m; }
      else { const m = inout(p(t, 13.4, 14.5)); x = ux + (gx - ux) * m; y = uy + (gy - uy) * m; }
      v.insertAdjacentHTML("beforeend", `<div class="cursor" style="left:${x}px;top:${y}px;opacity:${1 - out}">${cursorSVG}</div>` + tapAt(t, 10.95, ux + 6, uy + 6) + tapAt(t, 14.55, gx + 6, gy + 6));
    }
  }
}
window.render = render;
render(+(new URLSearchParams(location.search).get("t") || 0));
</script>
